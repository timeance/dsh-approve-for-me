name: DSH compatibility

on:
  push:
    branches:
      - "compat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    env:
      DSH_HARNESS_ROOT: deepseek-harness
      DSH_HARNESS_TSCONFIG: deepseek-harness/tsconfig.base.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rc.2
            ref: dsh-v0.1.1-rc.2
            os: ubuntu-latest
            node: 22.19.0
          - label: rc.2
            ref: dsh-v0.1.1-rc.2
            os: ubuntu-latest
            node: 24.x
          - label: rc.2
            ref: dsh-v0.1.1-rc.2
            os: windows-latest
            node: 22.19.0
          - label: rc.2
            ref: dsh-v0.1.1-rc.2
            os: windows-latest
            node: 24.x
          - label: alpha.1 source smoke
            ref: dsh-v0.1.2-alpha.1
            os: ubuntu-latest
            node: 24.x
          - label: alpha.4 source smoke
            ref: dsh-v0.1.2-alpha.4
            os: ubuntu-latest
            node: 24.x

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Check out DSH source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.ref }}
          path: deepseek-harness

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install and build DSH source libraries
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build:lib

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck against checked-out DSH source
        run: pnpm typecheck:harness

      - name: Typecheck, test, and build
        run: pnpm check

      - name: Verify package contents
        run: npm pack --dry-run --json --ignore-scripts
