name: DSH compatibility

on:
  push:
    branches:
      - "compat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: DSH ${{ matrix.dsh }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        dsh: ["0.1.1-rc.2", "0.1.2-rc.1", "0.1.5-rc.2"]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            node: 24.x
          - os: windows-latest
            node: 22.19.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Select actual DSH runtime dependencies
        run: node scripts/prepare-compat.mjs "${{ matrix.dsh }}"
      - name: Install latest from lockfile
        if: matrix.dsh == '0.1.5-rc.2'
        run: pnpm install --frozen-lockfile
      - name: Resolve representative old version
        if: matrix.dsh != '0.1.5-rc.2'
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck, test, and build on selected DSH version
        run: pnpm check
      - name: Verify package contents
        run: npm pack --dry-run --json --ignore-scripts
